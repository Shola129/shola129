<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Shola Ekundayo — Software Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="0" y="0" width="900" height="300" fill="#0a0a0a"/>
<rect x="0.5" y="0.5" width="899" height="299" fill="none" stroke="#2a2a28" stroke-width="1"/>
<defs>
<clipPath id="bladeClip"><rect x="560" y="0" width="0" height="300">
<animate attributeName="width" values="0;340" keyTimes="0;1" keySplines="0.65 0 0.2 1" calcMode="spline" dur="0.55s" begin="0.05s" fill="freeze"/></rect></clipPath>
<clipPath id="nameClip"><rect x="0" y="0" width="0" height="220">
<animate attributeName="width" values="0;640" keyTimes="0;1" keySplines="0.65 0 0.2 1" calcMode="spline" dur="0.5s" begin="0.35s" fill="freeze"/></rect></clipPath>
</defs>
<g clip-path="url(#bladeClip)">
<polygon points="900,0 900,300 680,300 780,0" fill="#e10600"/>
<polygon points="670,300 680,300 780,0 770,0" fill="#f5f5f0" opacity="0.9"/>
</g>
<g clip-path="url(#nameClip)">
<text x="48" y="118" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="84" letter-spacing="-2" fill="#f5f5f0">SHOLA</text>
<text x="48" y="196" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="84" letter-spacing="-2" fill="#f5f5f0">EKUNDAYO</text>
</g>
<line x1="48" y1="228" x2="48" y2="228" stroke="#f5f5f0" stroke-width="2"><animate attributeName="x2" values="48;560" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.2 1" dur="0.4s" begin="0.85s" fill="freeze"/></line>
<text x="48" y="258" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="17" letter-spacing="2" fill="#8a8a86" opacity="0">SOFTWARE ENGINEER — LAGOS, NIGERIA<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.01;1" dur="0.4s" begin="1.15s" fill="freeze"/></text>
